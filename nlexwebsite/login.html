<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NLEX MUSIC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: url('signpic.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      color: #fff;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    .form-container {
      position: relative;
      z-index: 1;
      background: rgba(0, 50, 50, 0.7);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 0 25px rgba(0, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      text-align: center;
      width: 100%;
      max-width: 400px;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .form-container .music-icon img {
      width: 60px;
      margin-bottom: 10px;
    }

    .form-container h3 {
      color: #00f5ff;
      font-weight: 700;
      font-size: 2rem;
      text-shadow: 0 0 15px rgba(0,255,255,0.4);
    }

    .form-container h5 {
      color: #fff;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.2);
      color: #fff;
      border-radius: 10px;
      transition: 0.3s;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .form-control:focus {
      background: rgba(0, 255, 255, 0.1);
      border-color: #00f5ff;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
    }

    .btn-teal {
      background-color: #00f5ff;
      color: #000;
      border: none;
      border-radius: 25px;
      padding: 10px;
      font-weight: bold;
      width: 100%;
      transition: all 0.3s;
    }

    .btn-teal:hover {
      background-color: #00a3a3;
      color: #fff;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
      transform: scale(1.02);
    }

    .alert {
      display: none;
    }

    .form-container p {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #ccc;
    }

    .form-container a {
      color: #00f5ff;
      text-decoration: none;
    }

    .form-container a:hover {
      text-decoration: underline;
    }

    @media (max-width: 500px) {
      .form-container {
        margin: 0 20px;
        padding: 30px 20px;
      }
      .form-container h3 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="overlay"></div>
  <div class="form-container">
    <div class="music-icon">
      <img src="logo.png" alt="Music Logo">
    </div>
    <h3><i class="fa-solid fa-headphones"></i> NLEX MUSIC</h3>
    <h5>Welcome Back</h5>

    <div id="alertMessage" class="alert alert-danger" role="alert">
      <i class="fa-solid fa-circle-exclamation"></i> Please enter both email and password.
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Password" required>
      </div>
      <button type="button" class="btn btn-teal" onclick="validateLogin()">
        <i class="fa-solid fa-right-to-bracket"></i> Login
      </button>
    </form>

  <p class="mt-3">Don't have an account? <a href="sign-up.php">Sign Up</a></p>
  </div>

  <script>
    function validateLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const alertMessage = document.getElementById("alertMessage");

      if (email === "" || password === "") {
        alertMessage.style.display = "block";
      } else {
        alertMessage.style.display = "none";
  // Redirect to homepage
  window.location.href = "index.php";
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
